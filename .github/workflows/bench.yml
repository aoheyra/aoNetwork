name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: aoheyra/aoNetwork-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  instructions:
    if: (github.repository == 'aoheyra/aoNetwork' || github.event_name == 'pull_request') && github.event.action != 'closed'
    name: Instruction counts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: count the head
        run: |
          cp .github/scripts/instructions.py "$RUNNER_TEMP/"
          python3 "$RUNNER_TEMP/instructions.py" count "$RUNNER_TEMP/head.json"
      - name: count the base
        run: |
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          python3 "$RUNNER_TEMP/instructions.py" count "$RUNNER_TEMP/base.json"
      - name: compare
        # Callgrind counts are exact, so a limit this tight cannot flake.
        run: python3 "$RUNNER_TEMP/instructions.py" compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" 0.05
