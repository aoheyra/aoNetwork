name: Scenarios

on:
  schedule:
    # Every night at 02:00 IST, which is 20:30 UTC.
    - cron: '30 20 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: aoheyra/aoNetwork-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scenarios:
    if: github.repository == 'aoheyra/aoNetwork' || github.event_name == 'pull_request'
    name: Scenario suite (512 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: run every scenario on 512 seeded topologies
        # A failure names its seed and node count; the run replays from
        # them exactly.
        run: cargo test --release --all-features --test scenarios
        env:
          AO_SCENARIO_SEEDS: 512
