[package]
name = "ao_network"
version = "0.1.0"
edition = "2024"
# MSRV: edition 2024 requires Rust 1.85+. Bump deliberately, never silently.
rust-version = "1.85"
description = "BLE link layer of the aoheyra mesh: frames, fragmentation, send queue, link state, topology and abuse protection (sans-IO)"
repository = "https://github.com/aoheyra/aoNetwork"
readme = "README.md"
keywords = ["bluetooth", "ble", "mesh", "networking"]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
# Distributed by git tag (NET-27); not published to crates.io.
publish = false

# The benches are criterion targets; the library has none, and libtest's
# bench harness would reject criterion's flags.
[lib]
bench = false

[dependencies]
# Typed error enums (NetError, SendError, ConfigError). MIT/Apache-2.0,
# actively maintained, MSRV well below ours. Hand-rolling Display for the
# many error variants this crate will grow (NET-04..18) is pure boilerplate.
thiserror = "2"
# Per-link spans and lifecycle events (NET-23). The standard Rust
# instrumentation API, MIT; it reads no clock and spawns nothing, and costs
# a branch per call site when no subscriber is installed.
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
# `Serialize` for Network::snapshot, behind the `serde` feature (NET-23).
# Never used for the wire format.
serde = { version = "1.0.219", default-features = false, features = ["std", "derive"], optional = true }

[dev-dependencies]
proptest = { version = "1.8", default-features = false, features = ["std"] }
# Hot-path benches (README, Development). Criterion is the standard
# measurement harness; dev-dependency only, never part of the library.
criterion = "0.7.0"
# Captures the tracing output of a simulator run as text (NET-23 tests).
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "std"] }
# Checks that a snapshot serializes (NET-23 tests).
serde_json = "1.0.140"

# Hot-path benches (README, Development).
[[bench]]
name = "codec"
harness = false

[[bench]]
name = "queue"
harness = false

[[bench]]
name = "reassembly"
harness = false

# Instruction counts under Callgrind, compared by CI; `bench = false` keeps
# it out of plain `cargo bench`, which has no Callgrind to count with.
[[bench]]
name = "instructions"
harness = false
bench = false

[features]
default = ["sim"]
# In-memory SimWorld transport (NET-09); used as a dev-dependency downstream.
sim = []
# NativeTransport adapter for the Kotlin BLE shim (NET-14). No UniFFI here.
native = []
# `Serialize` on Network::snapshot and the types in it (NET-23).
serde = ["dep:serde"]

[[example]]
name = "sim_chat"
required-features = ["sim"]
